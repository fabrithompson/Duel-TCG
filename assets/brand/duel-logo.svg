          <circle cx="0" cy="-12" r="9" fill="#8FE3FF" opacity=".22"/>
          <path d="M0 -19 L6 -15.5 V-8.5 L0 -5 L-6 -8.5 V-15.5 Z" fill="none" stroke="#D8F6FF" stroke-width="1.3"/>
        </g>
      </g>
    </g>
  </g>

  <g transform="translate(0,-14)">
    <g filter="url(#duel-sombra)">
      <g transform="scale(1.3)">
        <rect x="-30" y="-54" width="60" height="108" rx="6.5" fill="#FFFFFF" stroke="#241A13" stroke-width="2.5"/>
        <g clip-path="url(#duel-carta-centro)">
