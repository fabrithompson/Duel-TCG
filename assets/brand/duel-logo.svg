          <path d="M-40 4 C-28 -44 28 -44 40 4" stroke="#FFFFFF" stroke-width="8" opacity=".14" fill="none"/>
          <path d="M-36 -36 C-12 -14 14 -48 32 -18" stroke="#FFFFFF" stroke-width="5" opacity=".16" fill="none"/>
