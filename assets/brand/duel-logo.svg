    <path d="M-54 28 Q-54 85 0 85 Q54 85 54 28 Z" fill="#2B160C"/>
    <path d="M-46 42 Q-50 66 -30 78" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity=".08"/>
    <ellipse cx="0" cy="28" rx="54" ry="16" fill="#3D2B20" stroke="#C59542" stroke-width="3"/>
    <ellipse cx="0" cy="29" rx="48" ry="12.5" fill="#4A2C1A"/>
    <ellipse cx="8" cy="27" rx="26" ry="4.5" fill="#7A5236" opacity=".85"/>
    <circle cx="-30" cy="24" r="1.6" fill="#F2D59A"/>
