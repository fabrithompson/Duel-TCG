          <circle cx="0" cy="-12" r="13" fill="url(#duel-orbe)"/>
          <circle cx="0" cy="-12" r="13" fill="none" stroke="#FFFFFF" stroke-width="1" opacity=".6"/>
        </g>
      </g>
    </g>
  </g>

  <path d="M-100 30 Q-100 12 -82 12 L82 12 Q100 12 100 30 L100 62 Q100 122 0 154 Q-100 122 -100 62 Z" fill="none" stroke="#C59542" stroke-width="5" stroke-linejoin="round"/>

  <g filter="url(#duel-sombra-taza)">
    <ellipse cx="0" cy="87" rx="88" ry="23" fill="#8A4A22" stroke="#C59542" stroke-width="3"/>
    <ellipse cx="0" cy="86" rx="79" ry="19" fill="none" stroke="#C59542" stroke-width="1.2" opacity=".6"/>
    <ellipse cx="0" cy="84" rx="58" ry="12.5" fill="#5C2F14" stroke="#C59542" stroke-width="1.5"/>
