# Expo y React Native resuelven dependencias como si fuera npm: con node_modules plano
# se evitan paquetes nativos duplicados o que Metro no encuentra.
nodeLinker: hoisted

# Scripts de instalación permitidos (pnpm no corre ninguno sin permiso).
allowBuilds:
  '@firebase/util': true
  esbuild: true
  protobufjs: true

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.27'
  - '@expo/router-server@57.0.11'
  - babel-preset-expo@57.0.13
  - expo-modules-core@57.0.19
  - expo-modules-jsi@57.1.1
  - expo@57.0.25
  - '@expo/ui@57.0.20'
  - expo-glass-effect@57.0.4
  - expo-image-picker@57.0.20
  - expo-linking@57.0.11
  - expo-router@57.0.23
